name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Run pytest (mock embeddings, no model downloads)
        run: pytest -q

  evaluation:
    name: Real-model evaluation (Recall@5, groundedness, security)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      DRIVEDOCS_ONNX_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ hashFiles('configs/config.yaml') }}
      - name: Download models
        run: python scripts/download_models.py
      - name: Build the demo index (as the Render build does)
        env:
          HF_HUB_OFFLINE: "1"
          DRIVEDOCS_STORAGE_DIR: ${{ runner.temp }}/drivedocs-storage
        run: python scripts/build_demo_index.py
      - name: Real-model tests
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q -m real_models
      - name: Evaluation (fails on any QA or security regression)
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/run_eval.py --strict --output-dir "${{ runner.temp }}/eval"
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: ${{ runner.temp }}/eval
          if-no-files-found: ignore
