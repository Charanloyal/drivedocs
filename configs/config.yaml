app:
  name: "DriveDocs"
  version: "0.3.0"
  description: "Multimodal RAG assistant for vehicle manuals (LangChain agent, CLIP + FAISS, guardrails)"
  host: "0.0.0.0"
  port: 8000
  debug: false

hardware:
  # "cpu" (default) or "cuda". CUDA is only used when explicitly requested AND available.
  device: "cpu"

storage:
  # Root directory for everything DriveDocs writes. images/, indexes/, uploads/ and documents.json live under it.
  # Override with DRIVEDOCS_STORAGE_DIR (e.g. a Render persistent disk mount path).
  base_dir: "data/storage"
  # Set to true (or DRIVEDOCS_PERSISTENT_STORAGE=true) only when base_dir is on durable storage.
  persistent: false
  # Keep a private copy of each original upload (never served publicly) so indexes can be rebuilt.
  keep_original_uploads: true
  max_upload_size_bytes: 15728640 # 15 MB (override with DRIVEDOCS_MAX_UPLOAD_MB)
  max_documents: 500
  max_pdf_pages: 300
  max_images_per_document: 50
  max_image_pixels: 40000000 # decompression-bomb guard
  max_stored_image_side: 1600
  min_extracted_image_side: 40
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".md"
    - ".png"
    - ".jpg"
    - ".jpeg"

chunking:
  chunk_size: 500
  chunk_overlap: 100
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "
    - ""

embeddings:
  # "onnx" (default): ONNX Runtime, no PyTorch. all-MiniLM-L6-v2 (int8) + CLIP ViT-B/32 with 4-bit weights.
  #                   ~210 MB of model files; leaves room for the LangChain agent on a 512 MB instance.
  # "transformers":   full-precision PyTorch models (pip install torch transformers); ~1 GB RAM.
  # "mock":           deterministic hashing embeddings for tests only.
  # Variant choice (quality vs. memory vs. speed) is measured in docs/RAG_DESIGN.md §9.
  backend: "onnx"
  text:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"   # transformers backend
    onnx_repo: "Xenova/all-MiniLM-L6-v2"                   # onnx backend (same model, exported to ONNX)
    # int8 (default): -65 MB RSS vs fp32 with identical evaluation results on the vehicle corpus (docs/RAG_DESIGN.md
    # §9). Use onnx/model.onnx for fp32.
    onnx_file: "onnx/model_quantized.onnx"
    max_length: 256
    dimension: 384
    batch_size: 32
    normalize: true
    # transformers backend only: "native" runs the model with plain transformers (same vectors, less RAM than
    # importing sentence-transformers); "sentence-transformers" uses that library.
    encoder: "native"
  image:
    # Disable to save memory with DRIVEDOCS_ENABLE_IMAGE_SEARCH=false
    enabled: true
    model_name: "openai/clip-vit-base-patch32"             # transformers backend
    onnx_repo: "Xenova/clip-vit-base-patch32"              # onnx backend
    onnx_text_file: "onnx/text_model_q4.onnx"              # 4-bit text tower
    onnx_vision_file: "onnx/vision_model_q4.onnx"          # 4-bit vision tower
    dimension: 512
    batch_size: 16
    normalize: true

runtime:
  preload_models: true
  seed_sample_data: true
  max_concurrent_inference: 2
  # Seconds without image embedding after which the CLIP vision tower (~70 MB) is released; 0 keeps it loaded.
  # Text-to-image search only needs the always-loaded CLIP text tower.
  vision_idle_unload_seconds: 300
  ready_wait_seconds: 60

retrieval:
  default_top_k_text: 4
  default_top_k_images: 2
  # Thresholds are per modality because MiniLM and CLIP cosine scores are not comparable.
  # Calibrated on the bundled sample corpus (see docs/RAG_DESIGN.md); recalibrate for your own documents.
  text_min_score: 0.30                # gate: at least one passage must reach this to answer at all
  text_context_min_score: 0.20        # once the gate passes, passages above this may contribute sentences
  image_min_score: 0.30               # image accepted on its own
  image_min_score_visual_query: 0.25  # image accepted when the query asks for a diagram/chart/figure
  image_min_score_colocated: 0.25     # image accepted when on the same document page as accepted text evidence
  # Weighted Reciprocal Rank Fusion for the hybrid evidence list (rank-based; raw scores are never mixed)
  text_weight: 0.7
  image_weight: 0.3
  rrf_k: 60

generation:
  provider: "extractive" # Options: extractive, gemini, openai
  gemini_model: "gemini-1.5-flash"
  openai_model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 512
  timeout_seconds: 30
  max_answer_sentences: 3

agent:
  # LangChain tool-calling agent in front of the retriever (POST /chat with mode="agent", the default).
  enabled: true
  # "auto": use an LLM planner (ChatOpenAI / ChatGoogleGenerativeAI) when LLM_PROVIDER has an API key and its
  #         LangChain integration package is installed; otherwise the deterministic offline router.
  # "router": always use the offline router (no network, no key).
  planner: "auto"
  max_steps: 4          # model turns per question (each turn may call several tools)
  max_subquestions: 3   # compound questions are split into at most this many sub-questions

security:
  # Mask e-mails, phone numbers, VINs, card numbers, SSNs, street addresses and labelled personal fields
  # (Customer:, Owner:, Address: ...) before text is embedded, indexed or returned.
  redact_pii: true
  # Refuse questions that ask for a person's contact or payment details.
  block_pii_requests: true
  # Flag instruction-like text in questions and documents; it is never followed, quoted or sent to an LLM.
  detect_prompt_injection: true
