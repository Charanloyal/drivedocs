[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drivedocs"
version = "0.1.0"
description = "Multimodal Retrieval-Augmented Generation assistant for documents and images"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Charanloyal", email = "charankumarreddy2028@gmail.com" }
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "pillow>=10.0.0",
    "langchain>=0.2.0",
    "pypdf>=4.2.0",
    "reportlab>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
